{% extends "contas/base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<h1>Cadastro de Usuário</h1>
<form method="post">
    {% csrf_token %}
    {% for campo in form %}
        <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% for erro in campo.errors %}<p class="erro-campo">{{ erro }}</p>{% endfor %}
    {% endfor %}
    <button type="submit">Cadastrar</button>
</form>
<p class="link">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
